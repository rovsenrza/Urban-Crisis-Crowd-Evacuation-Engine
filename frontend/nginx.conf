server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # REST API və Swagger sənədləri
    # X-Forwarded-For: backend sürət həddini real müştəri ünvanına görə tətbiq edir
    # (TRUST_FORWARDED_FOR=true). $remote_addr müştərinin göndərdiyi başlığı əvəz edir.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /docs { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    # WebSocket
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA: /citizen və /operator marşrutları index.html-ə düşür
    location / { try_files $uri /index.html; }
}
